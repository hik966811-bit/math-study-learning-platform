<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play - H.O.R.U.S Games</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0a0e1a;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      background: rgba(0, 0, 0, 0.5);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      flex-wrap: wrap;
      gap: 10px;
    }

    .back-btn {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .game-info {
      flex: 1;
      margin: 0 20px;
      min-width: 200px;
    }

    .game-title {
      font-size: 16px;
      font-weight: 600;
    }

    .game-url {
      font-size: 12px;
      color: #94a3b8;
      font-family: monospace;
      margin-top: 2px;
    }

    .player-controls {
      display: flex;
      gap: 8px;
    }

    .control-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .control-btn.active {
      background: linear-gradient(90deg, #818cf8, #a78bfa);
    }

    .game-frame-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .game-frame-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      color: #94a3b8;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(129, 140, 248, 0.2);
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .fullscreen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #000;
    }

    .fullscreen .player-header {
      display: none;
    }

    .exit-fullscreen {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1001;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: none;
    }

    .fullscreen .exit-fullscreen {
      display: block;
    }

    .game-not-found {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 40px;
      text-align: center;
    }

    .game-not-found h2 {
      font-size: 24px;
      color: #fbbf24;
    }

    .game-not-found p {
      color: #94a3b8;
      max-width: 500px;
    }

    .game-not-found button {
      padding: 12px 30px;
      background: linear-gradient(90deg, #818cf8, #a78bfa);
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="player-header" id="playerHeader">
    <a href="/gamesss.html" class="back-btn">&larr; Back to Games</a>
    <div class="game-info">
      <div class="game-title" id="gameTitle">Loading game...</div>
      <div class="game-url" id="gameUrl">Initializing...</div>
    </div>
    <div class="player-controls">
      <button class="control-btn" id="fullscreenBtn" title="Fullscreen">⛶</button>
      <button class="control-btn" id="reloadBtn" title="Reload">↻</button>
    </div>
  </div>

  <button class="exit-fullscreen" id="exitFullscreen">Exit Fullscreen (ESC)</button>

  <div class="game-frame-container" id="gameContainer">
    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      <p>Loading game...</p>
    </div>
  </div>

  <script>
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function loadGame() {
      const gameId = getQueryParam('game');
      const gameTitle = document.getElementById('gameTitle');
      const gameUrl = document.getElementById('gameUrl');
      const container = document.getElementById('gameContainer');
      const loading = document.getElementById('loadingState');

      if (!gameId) {
        container.innerHTML = `
          <div class="game-not-found">
            <h2>No Game Selected</h2>
            <p>Please go back and select a game to play.</p>
            <a href="/gamesss.html" class="back-btn" style="text-decoration: none;">Back to Games</a>
          </div>
        `;
        gameTitle.textContent = 'No game selected';
        gameUrl.textContent = '';
        return;
      }

      const id = parseInt(gameId, 10);
      if (isNaN(id) || id < 1 || id > 80) {
        container.innerHTML = `
          <div class="game-not-found">
            <h2>Game Not Found</h2>
            <p>Sorry, game #${gameId} doesn't exist. Try a different game.</p>
            <a href="/gamesss.html" class="back-btn" style="text-decoration: none;">Back to Games</a>
          </div>
        `;
        gameTitle.textContent = 'Game not found';
        gameUrl.textContent = '';
        return;
      }

      gameTitle.textContent = 'Game ' + id;
      gameUrl.textContent = '/gamesss/cover(' + id + ').webp';

      const iframe = document.createElement('iframe');
      iframe.src = 'about:blank';
      iframe.style.display = 'block';
      iframe.allow = 'autoplay; camera; microphone; fullscreen; gamepad; encrypted-media';
      iframe.allowFullscreen = true;

      container.innerHTML = '';
      container.appendChild(iframe);

      setTimeout(function() {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          doc.open();
          doc.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <style>
                body {
                  margin: 0;
                  padding: 0;
                  background: linear-gradient(135deg, #1e1b4b, #0f1729);
                  color: white;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  min-height: 100vh;
                  text-align: center;
                  padding: 20px;
                }
                .container {
                  max-width: 500px;
                }
                h1 {
                  font-size: 48px;
                  margin-bottom: 16px;
                  background: linear-gradient(90deg, #818cf8, #a78bfa);
                  -webkit-background-clip: text;
                  -webkit-text-fill-color: transparent;
                }
                p {
                  color: #94a3b8;
                  margin-bottom: 24px;
                  line-height: 1.5;
                }
                .play-btn {
                  padding: 12px 32px;
                  background: linear-gradient(90deg, #818cf8, #a78bfa);
                  border: none;
                  color: white;
                  border-radius: 8px;
                  cursor: pointer;
                  font-size: 16px;
                  font-weight: 600;
                  margin: 4px;
                }
                .cover {
                  width: 200px;
                  height: 250px;
                  margin: 0 auto 24px;
                  border-radius: 16px;
                  overflow: hidden;
                  border: 2px solid rgba(255,255,255,0.2);
                }
                .cover img {
                  width: 100%;
                  height: 100%;
                  object-fit: cover;
                }
              </style>
            </head>
            <body>
              <div class="container">
                <div class="cover">
                  <img src="/gamesss/cover(${id}).webp" alt="Game ${id}" onerror="this.style.display='none'" />
                </div>
                <h1>Game ${id}</h1>
                <p>This is a placeholder for game ${id}. The game files are hosted externally and are not available locally.</p>
                <button class="play-btn" onclick="window.parent.postMessage({type: 'launchExternal', gameId: ${id}}, '*')">Try External Source</button>
                <button class="play-btn" onclick="window.close()">Close</button>
              </div>
            </body>
            </html>
          `);
          doc.close();
        } catch (e) {
          console.error('Error:', e);
        }
      }, 100);
    }

    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const exitFullscreenBtn = document.getElementById('exitFullscreen');
    const reloadBtn = document.getElementById('reloadBtn');

    fullscreenBtn.onclick = function() {
      document.body.classList.toggle('fullscreen');
    };

    exitFullscreenBtn.onclick = function() {
      document.body.classList.remove('fullscreen');
    };

    reloadBtn.onclick = function() {
      loadGame();
    };

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        document.body.classList.remove('fullscreen');
      }
    });

    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'launchExternal') {
        alert('External game source would launch here. Game ID: ' + e.data.gameId);
      }
    });

    loadGame();
  </script>
</body>
</html>
