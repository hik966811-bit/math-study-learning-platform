<!DOCTYPE html>
<html lang="en">
<head>
    <base href="https://cdn.jsdelivr.net/gh/blazerida/fnaf@latest/1/">
    <link rel="stylesheet" type="text/css" href="style.css"/>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Five Nights at Freddy's</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }
        #MMFCanvas {
            max-width: 100vw;
            max-height: 100vh;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            margin: auto;
        }
        #progress-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        .progress-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #60a5fa;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div style="display: flex; width: 100%; height: 100%; align-items: center; justify-content: center;">
        <canvas id="MMFCanvas" width="1280" height="720">Your browser does not support HTML5 Canvas.</canvas>
    </div>

    <div id="progress-container">
        <div class="progress-title">LOADING FNAF 1</div>
        <div style="margin-bottom: 6px; font-size: 12px; display: flex; justify-content: space-between;">
            <span style="color: #94a3b8;">Downloading assets</span>
            <span id="download-text" style="color: #3b82f6; font-weight: bold;">0%</span>
        </div>
        <div style="width: 100%; background: #1e293b; border-radius: 6px; overflow: hidden; margin-bottom: 12px;">
            <div id="download-bar" style="height: 8px; background: #3b82f6; width: 0%; transition: width 0.2s; border-radius: 6px;"></div>
        </div>
        <div style="margin-bottom: 6px; font-size: 12px; display: flex; justify-content: space-between;">
            <span style="color: #94a3b8;">Extracting game engine</span>
            <span id="extract-text" style="color: #10b981; font-weight: bold;">0%</span>
        </div>
        <div style="width: 100%; background: #1e293b; border-radius: 6px; overflow: hidden;">
            <div id="extract-bar" style="height: 8px; background: #10b981; width: 0%; transition: width 0.2s; border-radius: 6px;"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
